<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode History</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>History</h1>
          <div class="brand-actions">
            <button id="newChatBtn" class="small-button primary" title="New chat">New</button>
            <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh">R</button>
          </div>
        </div>
        <input id="search" class="search" placeholder="Search chats" />
        <div class="batch-bar">
          <button id="selectModeBtn" class="small-button">Select</button>
          <button id="deleteSelectedBtn" class="small-button danger" disabled>Delete selected</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </aside>

      <section class="chat">
        <header class="chat-header">
          <div class="chat-title-wrap">
            <input id="titleInput" class="title-input" value="New chat" disabled />
            <div id="meta" class="meta">No chat selected</div>
          </div>
        </header>

        <div class="chat-body">
          <section class="conversation">
            <div id="empty" class="empty">
              <div class="new-chat-box">
                <div class="new-chat-title">New chat</div>
                <p>Select a history item on the left, or continue in OpenCode normally.</p>
                <button id="openNewBtn" class="primary">Open OpenCode</button>
              </div>
            </div>

            <div id="messages" class="messages"></div>
            <div id="permissionPanel" class="permission-panel"></div>
            <form id="composer" class="composer">
              <div id="attachmentList" class="attachment-list"></div>
              <input id="imageInput" type="file" accept="image/*" multiple hidden />
              <button id="attachBtn" class="icon-button attach-button" type="button" title="Attach image" aria-label="Attach image">+</button>
              <textarea id="promptInput" class="prompt-input" rows="1" placeholder="Message OpenCode"></textarea>
              <button id="sendBtn" class="primary send-button" type="submit">Send</button>
              <div id="composerStatus" class="composer-status" aria-live="polite"></div>
            </form>
          </section>

          <aside class="details">
            <div class="details-card">
              <div class="details-title">Session</div>
              <dl>
                <dt>Status</dt>
                <dd id="detailStatus">New chat</dd>
                <dt>Updated</dt>
                <dd id="detailUpdated">-</dd>
                <dt>Model</dt>
                <dd id="detailModel">-</dd>
                <dt>Tokens</dt>
                <dd id="detailTokens">-</dd>
              </dl>
            </div>

            <div class="details-card">
              <div class="details-title">Quick actions</div>
              <button id="sideContinue" class="primary wide" disabled>Continue chat</button>
              <button id="sideSnapshot" class="wide" disabled>Balanced snapshot</button>
              <button id="sidePin" class="wide" disabled>Pin</button>
              <button id="sideRename" class="wide" disabled>Rename</button>
              <button id="sideDelete" class="danger wide" disabled>Delete</button>
            </div>

            <div class="details-card">
              <div class="details-title">Browser settings</div>
              <label class="field-label" for="modelSelect">Model</label>
              <select id="modelSelect" class="select-input">
                <option value="">Follow OpenCode</option>
              </select>
              <label class="field-label" for="themeSelect">Theme</label>
              <select id="themeSelect" class="select-input">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
