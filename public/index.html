<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode History</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <h1>History</h1>
            <p>OpenCode chats</p>
          </div>
          <button id="refresh" title="Refresh">Refresh</button>
        </div>
        <input id="search" class="search" placeholder="Search chats" />
        <div id="sessionList" class="session-list"></div>
      </aside>

      <section class="chat">
        <header class="chat-header">
          <div class="chat-title-wrap">
            <input id="titleInput" class="title-input" value="New chat" disabled />
            <div id="meta" class="meta">No chat selected</div>
          </div>
          <div class="actions">
            <button id="newBtn">New</button>
            <button id="pinBtn" disabled>Pin</button>
            <button id="renameBtn" disabled>Rename</button>
            <button id="openBtn" class="primary" disabled>Continue</button>
          </div>
        </header>

        <div id="empty" class="empty">
          <div class="new-chat-box">
            <div class="new-chat-title">New chat</div>
            <p>Select a history item on the left, or continue in OpenCode normally.</p>
            <button id="openNewBtn" class="primary">Open OpenCode</button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
