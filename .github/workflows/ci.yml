name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Check JavaScript and tests
        run: |
          npm run check
          npm test
          npm run qa:lifecycle
      - name: Check package contents
        if: runner.os == 'Linux'
        run: |
          npm pack --json > pack.json
          node -e 'const fs=require("fs"); const files=JSON.parse(fs.readFileSync("pack.json","utf8"))[0].files.map(f=>f.path); const required=["README.md","install-redirect.js","lib/cleanup.js","lib/identity.js","lib/opencode-cli.js","lib/process-tree.js","lib/redirect.js","lib/static-files.js","lib/write-queue.js","log.js","package.json","public/app.js","public/index.html","public/styles.css","standalone.js","tui.js"]; const missing=required.filter(file=>!files.includes(file)); if (missing.length) { console.error({missing,files}); process.exit(1); }'
